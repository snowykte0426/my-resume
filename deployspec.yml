version: "1.0"

hooks:
  AfterInstall:
    - location: deploy/scripts/after_install.sh
      timeout: 1800
  ApplicationStart:
    - location: deploy/scripts/start_application.sh
      timeout: 180
  ValidateService:
    - location: deploy/scripts/validate_service.sh
      timeout: 300

permissions:
  - object: /
    pattern: "**"
    mode: "0644"
    type:
      - file
  - object: deploy/scripts
    pattern: "*.sh"
    mode: "0755"
    type:
      - file
